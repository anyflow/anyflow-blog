name: Verify blog content
on:
  pull_request:
    branches: [main]
    paths: [content.lock]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'automation/blog-content'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read content revision
        id: content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$BASE_SHA")" = content.lock
          revision=$(cat content.lock)
          printf '%s\n' "$revision" | grep -xE '[a-f0-9]{40}'
          printf 'sha=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: anyflow/blog
          ref: ${{ steps.content.outputs.sha }}
          path: .cache/blog
          ssh-key: ${{ secrets.BLOG_CONTENT_READ_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Validate and build pinned content
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npm ci
          npm run build
