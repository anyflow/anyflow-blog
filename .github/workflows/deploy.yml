name: Deploy latest declaration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-latest
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy latest declaration without rebuilding
        env:
          DEPLOY_SECRET: ${{ secrets.BLOG_DEPLOY_SECRET }}
          DEPLOY_URL: https://blog.anyflow.net/api/deploy
        run: node scripts/request-deploy.js
