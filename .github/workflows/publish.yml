name: Publish blog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: publish-blog
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Plan image versions
        id: release
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          node scripts/release-version.js check-range "$BEFORE"
          node --test tests/deployment-images.test.js
          node scripts/release-version.js plan >> "$GITHUB_OUTPUT"
          printf 'source=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.release.outputs.version != ''
        with:
          repository: anyflow/blog
          ref: ${{ steps.release.outputs.content }}
          path: .cache/blog
          ssh-key: ${{ secrets.BLOG_CONTENT_READ_KEY }}
          persist-credentials: false
      - uses: actions/cache@v6
        if: steps.release.outputs.version != ''
        with:
          path: |
            .cache/card-images
            .cache/x-thumbnails.json
            .cache/link-previews.json
          key: card-images-${{ runner.os }}-${{ hashFiles('lib/card-images.js', 'src/js/vendor/mermaid-profile.js', 'src/js/vendor/mermaid.min.js') }}-${{ github.run_id }}
          restore-keys: |
            card-images-${{ runner.os }}-${{ hashFiles('lib/card-images.js', 'src/js/vendor/mermaid-profile.js', 'src/js/vendor/mermaid.min.js') }}-
      - name: Build static artifacts and card images
        if: steps.release.outputs.version != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npm ci
          npm run build
      - uses: docker/setup-buildx-action@v4
        if: steps.release.outputs.version != ''
      - uses: docker/login-action@v4
        if: steps.release.outputs.version != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build static site
        id: site
        if: steps.release.outputs.version != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/anyflow/blog-app:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.source }}
            net.anyflow.blog.content-revision=${{ steps.release.outputs.content }}
      - name: Build comments API
        id: comments
        if: steps.release.outputs.build_comments == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: blog-app-comments
          platforms: linux/amd64
          push: true
          tags: ghcr.io/anyflow/blog-app-comments:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.source }}
      - name: Publish images and tag the release
        if: steps.release.outputs.version != ''
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source }}
          CONTENT_SHA: ${{ steps.release.outputs.content }}
          VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
          SITE_DIGEST: ${{ steps.site.outputs.digest }}
          COMMENTS_DIGEST: ${{ steps.comments.outputs.digest }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          previous=$(node scripts/release-version.js published origin/main)
          if [[ "$(jq -er '.tag' <<< "$previous")" != "$PREVIOUS_TAG" ]]; then
            echo "A newer release tag already exists."
            exit 0
          fi
          site_digest=$(bash scripts/publish-image.sh blog-app "$VERSION" "$SITE_DIGEST" "$SOURCE_SHA" "$CONTENT_SHA")
          comments_source="$SOURCE_SHA"
          if [[ -z "$COMMENTS_DIGEST" ]]; then
            COMMENTS_DIGEST=$(jq -er '.comments' <<< "$previous")
            comments_source=""
          fi
          comments_digest=$(bash scripts/publish-image.sh blog-app-comments "$VERSION" "$COMMENTS_DIGEST" "$comments_source" "")
          metadata=$(printf 'Content-Revision: %s\nSite-Digest: %s\nComments-Digest: %s' \
            "$CONTENT_SHA" "$site_digest" "$comments_digest")
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            tag -a "v$VERSION" "$SOURCE_SHA" -m "Release v$VERSION" -m "$metadata"
          git push origin "refs/tags/v$VERSION"
      - uses: actions/checkout@v7
        with:
          repository: anyflow/home-platform
          ref: main
          path: .cache/home-platform
          token: ${{ secrets.GH_ACCESS_TOKEN }}
      - name: Open or update production deployment PR
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: bash scripts/propose-deployment.sh
