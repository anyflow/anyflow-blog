name: Publish blog
on:
  push:
    branches: [main]
    paths-ignore:
      - release.json
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: publish-blog
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Plan image versions
        id: release
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          node scripts/release-version.js check-range "$BEFORE"
          node --test tests/deployment-images.test.js
          node scripts/release-version.js plan >> "$GITHUB_OUTPUT"
          printf 'source=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.release.outputs.site != '' || steps.release.outputs.comments != ''
        with:
          repository: anyflow/blog
          ref: ${{ steps.release.outputs.content }}
          path: .cache/blog
          ssh-key: ${{ secrets.BLOG_CONTENT_READ_KEY }}
          persist-credentials: false
      - uses: actions/cache@v6
        if: steps.release.outputs.site != '' || steps.release.outputs.comments != ''
        with:
          path: |
            .cache/card-images
            .cache/x-thumbnails.json
            .cache/link-previews.json
          key: card-images-${{ runner.os }}-${{ hashFiles('lib/card-images.js', 'src/js/vendor/mermaid-profile.js', 'src/js/vendor/mermaid.min.js') }}-${{ github.run_id }}
          restore-keys: |
            card-images-${{ runner.os }}-${{ hashFiles('lib/card-images.js', 'src/js/vendor/mermaid-profile.js', 'src/js/vendor/mermaid.min.js') }}-
      - name: Build static artifacts and card images
        if: steps.release.outputs.site != '' || steps.release.outputs.comments != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          npm ci
          npm run build
      - uses: docker/setup-buildx-action@v4
        if: steps.release.outputs.site != '' || steps.release.outputs.comments != ''
      - uses: docker/login-action@v4
        if: steps.release.outputs.site != '' || steps.release.outputs.comments != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build static site
        id: site
        if: steps.release.outputs.site != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/anyflow/anyflow-blog:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.source }}
            net.anyflow.blog.content-revision=${{ steps.release.outputs.content }}
      - name: Build comments API
        id: comments
        if: steps.release.outputs.comments != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          target: comments-api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/anyflow/anyflow-blog-comments:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.source }}
      - name: Publish versions and record release
        if: steps.release.outputs.site != '' || steps.release.outputs.comments != ''
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source }}
          CONTENT_SHA: ${{ steps.release.outputs.content }}
          SITE_VERSION: ${{ steps.release.outputs.site }}
          COMMENTS_VERSION: ${{ steps.release.outputs.comments }}
          SITE_DIGEST: ${{ steps.site.outputs.digest }}
          COMMENTS_DIGEST: ${{ steps.comments.outputs.digest }}
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          if ! git diff --quiet "$SOURCE_SHA" origin/main -- release.json; then
            echo "A newer release has already been recorded."
            git switch --detach origin/main
            exit 0
          fi
          bash scripts/publish-image.sh anyflow-blog "$SITE_VERSION" "$SITE_DIGEST" "$SOURCE_SHA" "$CONTENT_SHA"
          bash scripts/publish-image.sh anyflow-blog-comments "$COMMENTS_VERSION" "$COMMENTS_DIGEST" "$SOURCE_SHA" ""
          git switch --detach origin/main
          node scripts/release-version.js record
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release.json
          git commit -m "chore: release blog images"
          git push origin HEAD:main
      - uses: actions/checkout@v7
        with:
          repository: anyflow/home-platform
          ref: main
          path: .cache/home-platform
          token: ${{ secrets.GH_ACCESS_TOKEN }}
      - name: Open or update production deployment PR
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
        run: bash scripts/propose-deployment.sh
