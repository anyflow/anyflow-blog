apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anyflow-blog-deploy-state
  namespace: service
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anyflow-blog-comments-state
  namespace: service
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
