apiVersion: v1
kind: Service
metadata:
  name: anyflow-blog
  namespace: service
  labels:
    app: anyflow-blog
spec:
  type: ClusterIP
  selector:
    app: anyflow-blog
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: anyflow-blog-comments
  namespace: service
spec:
  selector:
    app: anyflow-blog-comments
  ports:
    - port: 3000
      targetPort: 3000
