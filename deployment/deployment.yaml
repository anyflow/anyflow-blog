apiVersion: apps/v1
kind: Deployment
metadata:
  name: anyflow-blog
  namespace: service
  labels:
    app: anyflow-blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anyflow-blog
  template:
    metadata:
      labels:
        app: anyflow-blog
    spec:
      containers:
        - name: anyflow-blog
          image: ghcr.io/anyflow/anyflow-blog:normalize-20261013-6ff55de
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
