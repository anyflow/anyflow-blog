apiVersion: apps/v1
kind: Deployment
metadata:
  name: anyflow-blog
  namespace: service
  labels:
    app: anyflow-blog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anyflow-blog
  template:
    metadata:
      labels:
        app: anyflow-blog
    spec:
      imagePullSecrets:
        - name: anyflow-blog-registry
      containers:
        - name: anyflow-blog
          image: ghcr.io/anyflow/anyflow-blog@sha256:e56b7d22b8e6346dd76401e26ef65c2e07ebb27d08b7fdded36e243fbafb7d99
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anyflow-blog-comments
  namespace: service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: anyflow-blog-comments
  template:
    metadata:
      labels:
        app: anyflow-blog-comments
    spec:
      imagePullSecrets:
        - name: anyflow-blog-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/anyflow/anyflow-blog-comments@sha256:d2d6603bb828d56f00ca627161bb5717f6180f07c22294858b06142018cb8a23
          ports:
            - containerPort: 3000
          env:
            - name: COMMENTS_PREVIEW
              value: "false"
            - name: COMMENTS_DATA_DIR
              value: /data/repository
            - name: COMMENTS_QUEUE_DIR
              value: /data/queue
            - name: COMMENTS_GIT_REMOTE
              value: git@github.com:anyflow/blog-comments.git
            - name: COMMENTS_CONFIG
              value: /etc/comments/config.json
            - name: COMMENTS_CATALOG_URL
              value: http://anyflow-blog/comments/catalog.json
            - name: GIT_SSH_COMMAND
              value: ssh -i /etc/comments/github-comment-deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/etc/comments/known_hosts -o HostName=github.com -o HostKeyAlias=github.com -p22 -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: credentials
              mountPath: /etc/comments
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 3000
          livenessProbe:
            tcpSocket:
              port: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anyflow-blog-comments-state
        - name: credentials
          secret:
            secretName: anyflow-blog-comments
            defaultMode: 0440
