apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: anyflow-blog
  namespace: service
spec:
  parentRefs:
    - kind: Gateway
      name: public-gateway
      namespace: cluster
  hostnames:
    - blog.anyflow.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/deploy
      backendRefs:
        - name: anyflow-blog-deploy
          port: 18767
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: anyflow-blog
          port: 80
