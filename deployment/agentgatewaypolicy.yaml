apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: anyflow-blog-api-limits
  namespace: service
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: anyflow-blog
  traffic:
    # Core i3 이전 중 기존 댓글 API가 처리 중인 작업을 끝낼 때까지 새 쓰기를 막는다.
    authorization:
      action: Require
      policy:
        matchExpressions:
          - '!request.path.startsWith("/api/") || request.method in ["GET", "HEAD", "OPTIONS"]'
    rateLimit:
      conditional:
        - condition: 'request.method == "POST" && request.path.contains("/login")'
          policy:
            local:
              - requests: 5
                unit: Minutes
                burst: 2
                key: string(source.address)
              - requests: 20
                unit: Minutes
                burst: 5
        - condition: 'request.method != "GET" && request.method != "HEAD" && request.method != "OPTIONS"'
          policy:
            local:
              - requests: 30
                unit: Minutes
                burst: 10
                key: string(source.address)
              - requests: 120
                unit: Minutes
                burst: 30
        - condition: 'request.path.contains("/api/")'
          policy:
            local:
              - requests: 120
                unit: Minutes
                burst: 30
                key: string(source.address)
              - requests: 600
                unit: Minutes
                burst: 120
